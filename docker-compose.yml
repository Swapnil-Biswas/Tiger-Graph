version: "3.8"

services:
  tigergraph-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tigergraph-fraud-agent
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/telemetry/dashboard"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - fraud-net

  prometheus:
    image: prom/prometheus:latest
    container_name: tigergraph-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - tigergraph-agent
    restart: unless-stopped
    networks:
      - fraud-net

  grafana:
    image: grafana/grafana:latest
    container_name: tigergraph-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=tigergraph
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/fraud_sla_dashboard.json:/var/lib/grafana/dashboards/fraud_sla_dashboard.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - fraud-net

networks:
  fraud-net:
    driver: bridge
